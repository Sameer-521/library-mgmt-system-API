<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members - Library</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/pages.css" />
    <link rel="icon" type="image/png" href="../assets/icons/library.png" />
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/core/session.js"></script>
    <script
      src="../assets/js/core/guard.js"
      data-auth="required"
      data-role="staff"
    ></script>
    <script src="../assets/js/layout.js" defer></script>
  </head>
  <body data-title="Members">
    <div class="shell">
      <aside class="sidebar" id="sidebar-nav">
        <a class="sidebar__brand" href="../catalog.html">
          <div>
            <h2 class="sidebar__brand-name">Library</h2>
            <p class="sidebar__brand-sub">Management System</p>
          </div>
        </a>
        <nav class="sidebar__nav" aria-label="Main"></nav>
        <footer class="sidebar__footer">
          <button class="btn btn--block logout-btn" type="button">Logout</button>
        </footer>
      </aside>
      <div class="main">
        <header class="topbar">
          <button
            class="nav-toggle"
            type="button"
            aria-controls="sidebar-nav"
            aria-expanded="false"
            aria-label="Open navigation"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              viewBox="0 0 16 16"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              viewBox="0 0 16 16"
              aria-hidden="true"
              hidden
            >
              <path
                d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708-.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
              />
            </svg>
          </button>
          <p class="topbar__title"></p>
          <div class="topbar__user">
            <span class="topbar__email"></span>
            <span class="badge"></span>
          </div>
        </header>
        <main class="content">
          <div class="page-head">
            <div>
              <h1>Members</h1>
              <p class="page-head__sub">
                Library members registered through the sign-up form.
              </p>
            </div>
          </div>

          <div id="alert" class="alert" role="alert" hidden></div>

          <div
            class="seg"
            id="role-tabs"
            role="group"
            aria-label="Filter by role"
            hidden
          >
            <button
              class="seg__btn"
              type="button"
              id="tab-members"
              aria-pressed="true"
            >
              Members
            </button>
            <button
              class="seg__btn"
              type="button"
              id="tab-staff"
              aria-pressed="false"
            >
              Staff
            </button>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>User ID</th>
                    <th>Card number</th>
                    <th>Joined</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="member-rows"></tbody>
              </table>
            </div>
            <div id="empty-state" class="empty-state" hidden>
              <h2 class="empty-state__title">No users found</h2>
              <p class="empty-state__text">This category is empty.</p>
            </div>
            <div id="loading-state" class="card__body muted">Loading...</div>
            <nav
              class="pagination"
              aria-label="Pagination"
              id="pagination"
              hidden
            >
              <p class="pagination__info" id="page-info"></p>
              <div class="pagination__controls">
                <button
                  class="btn btn--secondary"
                  type="button"
                  id="prev-btn"
                  disabled
                >
                  Prev
                </button>
                <button
                  class="btn btn--secondary"
                  type="button"
                  id="next-btn"
                  disabled
                >
                  Next
                </button>
              </div>
            </nav>
          </div>
        </main>
      </div>
      <div class="scrim"></div>
    </div>
    <script type="module" src="../assets/js/pages/staff/members.js"></script>
  </body>
</html>
