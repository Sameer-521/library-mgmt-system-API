<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans - Library</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="icon" type="image/png" href="../assets/icons/library.png">
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/guard.js" data-auth="required" data-role="staff"></script>
  <script src="../assets/js/layout.js" defer></script>
</head>
<body data-title="Loans">
  <div class="page-head">
    <div>
      <h1>Loans</h1>
      <p class="page-head__sub">Check out and return book copies for members.</p>
    </div>
  </div>

  <div id="alert" class="alert" hidden></div>

  <div class="desk-grid">
    <div class="card">
      <div class="card__header">Checkout</div>
      <div class="card__body">
        <form id="checkout-form" novalidate>
          <div class="field">
            <label class="field__label" for="checkout-member">Member</label>
            <input class="input" type="text" id="checkout-member" list="member-options"
                   placeholder="Start typing an email or user ID"
                   autocomplete="off" required>
            <datalist id="member-options"></datalist>
            <div class="field__hint">Pick a member from the list.</div>
          </div>
          <div class="field">
            <label class="field__label" for="checkout-isbn">ISBN</label>
            <input class="input mono" type="text" id="checkout-isbn" placeholder="e.g. 11223344" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit" id="checkout-submit">Check out</button>
        </form>
        <p class="muted desk-result" id="checkout-result" hidden></p>
      </div>
    </div>

    <div class="card">
      <div class="card__header">Return</div>
      <div class="card__body">
        <form id="return-form" novalidate>
          <div class="field">
            <label class="field__label" for="return-loan-id">Loan ID</label>
            <input class="input mono" type="text" id="return-loan-id" placeholder="e.g. LN-..." required>
          </div>
          <div class="field">
            <label class="field__label" for="return-barcode">Copy barcode</label>
            <input class="input mono" type="text" id="return-barcode" placeholder="e.g. LIB-...-0001" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit" id="return-submit">Return</button>
        </form>
        <p class="muted desk-result" id="return-result" hidden></p>
      </div>
    </div>
  </div>

  <p class="muted" id="summary" style="margin-bottom: 12px" hidden></p>

  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Loan ID</th>
            <th>Member</th>
            <th>Book</th>
            <th>Copy</th>
            <th>Checked out</th>
            <th>Due</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="loan-rows"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state__title">No active loans</div>
      <div class="empty-state__text">There are currently no copies on loan.</div>
    </div>
    <div id="loading-state" class="card__body muted">Loading...</div>
    <div class="pagination" id="pagination" hidden>
      <span class="pagination__info" id="page-info"></span>
      <div class="pagination__controls">
        <a class="btn btn--secondary" id="prev-btn">Prev</a>
        <a class="btn btn--secondary" id="next-btn">Next</a>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/staff/loans.js"></script>
</body>
</html>
