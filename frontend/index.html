<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Library</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="icon" href="data:,">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core/session.js"></script>
  <script src="assets/js/core/guard.js" data-auth="guest"></script>
</head>
<body data-layout="auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card__brand">
        <div class="auth-card__brand-name">Library</div>
        <div class="auth-card__brand-sub">Management System</div>
      </div>
      <div class="card">
        <div class="card__body">
          <div id="alert" class="alert" hidden></div>
          <form id="login-form" novalidate>
            <div class="field">
              <label class="field__label" for="email">Email</label>
              <input class="input" type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label class="field__label" for="password">Password</label>
              <div class="input-group">
                <input class="input" type="password" id="password" autocomplete="current-password" required>
                <button type="button" class="input-action" id="toggle-password" aria-label="Show password" aria-pressed="false">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" hidden>
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                  </svg>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                    <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                    <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                  </svg>
                </button>
              </div>
            </div>
            <button class="btn btn--primary btn--block" type="submit" id="submit-btn">Login</button>
          </form>
        </div>
      </div>
      <p class="auth-alt">No account yet? <a href="signup.html">Create one</a></p>
    </div>
  </div>
  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
