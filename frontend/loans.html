<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Loans - Library</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="icon" type="image/png" href="assets/icons/library.png">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core/session.js"></script>
  <script src="assets/js/core/guard.js" data-auth="required"></script>
  <script src="assets/js/layout.js" defer></script>
</head>
<body data-title="My Loans">
  <div class="page-head">
    <div>
      <h1>My Loans</h1>
      <p class="page-head__sub">Copies you have checked out, newest first.</p>
    </div>
  </div>

  <div id="alert" class="alert" hidden></div>

  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Book</th>
            <th>Copy</th>
            <th>Checked out</th>
            <th>Due</th>
            <th>Returned</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="loan-rows"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state__title">No loans yet</div>
      <div class="empty-state__text">Copies checked out at the desk will appear here.</div>
      <p style="margin-top: 12px"><a href="catalog.html">Browse the catalog</a></p>
    </div>
    <div id="loading-state" class="card__body muted">Loading...</div>
    <div class="pagination" id="pagination" hidden>
      <span class="pagination__info" id="page-info"></span>
      <div class="pagination__controls">
        <a class="btn btn--secondary" id="prev-btn">Prev</a>
        <a class="btn btn--secondary" id="next-btn">Next</a>
      </div>
    </div>
  </div>
  <script type="module" src="assets/js/pages/loans.js"></script>
</body>
</html>
